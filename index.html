
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudSpace Academy | Container Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy-dark: #0a192f;
            --navy-mid: #112240;
            --navy-light: #233554;
            --accent: #0077b6;
            /* Changed to a deeper blue for white background */
            --accent-bright: #48cae4;
            --text-main: #0a192f;
            --text-dim: #4a5568;
            --white: #ffffff;
            --off-white: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--white);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated Background Elements */
        .floating-elements {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            pointer-events: none;
        }

        .element {
            position: absolute;
            background: linear-gradient(135deg, var(--accent), var(--accent-bright));
            border-radius: 50%;
            opacity: 0.15;
            filter: blur(40px);
            animation: move linear infinite;
        }

        .el-1 {
            width: 300px;
            height: 300px;
            top: 10%;
            left: 10%;
            animation-duration: 20s;
        }

        .el-2 {
            width: 400px;
            height: 400px;
            bottom: 10%;
            right: 10%;
            animation-duration: 25s;
            opacity: 0.1;
        }

        .el-3 {
            width: 200px;
            height: 200px;
            top: 40%;
            right: 20%;
            animation-duration: 15s;
            opacity: 0.2;
        }

        @keyframes move {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }

            33% {
                transform: translate(100px, 50px) rotate(120deg);
            }

            66% {
                transform: translate(-50px, 100px) rotate(240deg);
            }

            100% {
                transform: translate(0, 0) rotate(360deg);
            }
        }

        /* Floating Circles */
        .circle {
            position: absolute;
            border: 2px solid var(--accent);
            border-radius: 50%;
            opacity: 0.2;
            animation: float-up infinite ease-in-out;
        }

        @keyframes float-up {

            0%,
            100% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(-30px) scale(1.1);
            }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 800px;
            padding: 40px;
            text-align: center;
        }

        /* Glassmorphism Card (Navy) */
        .glass-card {
            background: var(--navy-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 60px 40px;
            box-shadow: 0 40px 100px -20px rgba(10, 25, 47, 0.3);
            animation: fadeInScale 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            color: var(--white);
        }

        .logo-container {
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--accent-bright), #90e0ef);
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(72, 202, 228, 0.3);
            animation: logo-float 4s ease-in-out infinite;
        }

        h1 {
            font-size: 3rem;
            font-weight: 600;
            margin-bottom: 10px;
            letter-spacing: -0.02em;
        }

        .academy-name {
            color: var(--accent-bright);
            font-size: 1.2rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            margin-bottom: 20px;
            display: block;
        }

        p {
            color: #8892b0;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 40px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(72, 202, 228, 0.1);
            border: 1px solid var(--accent-bright);
            color: var(--accent-bright);
            padding: 8px 20px;
            border-radius: 100px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 30px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-bright);
            border-radius: 50%;
            margin-right: 10px;
            box-shadow: 0 0 10px var(--accent-bright);
            animation: pulse 2s infinite;
        }

        /* Animations */
        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(20px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes logo-float {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-10px) rotate(5deg);
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.5);
                opacity: 0.5;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Responsive */
        @media (max-width: 640px) {
            h1 {
                font-size: 2.2rem;
            }

            .glass-card {
                padding: 40px 20px;
            }
        }
    </style>
</head>

<body>
    <div class="floating-elements">
        <div class="element el-1"></div>
        <div class="element el-2"></div>
        <div class="element el-3"></div>
        <div class="circle" style="width: 40px; height: 40px; top: 15%; left: 25%; animation-delay: 0s;"></div>
        <div class="circle" style="width: 60px; height: 60px; bottom: 20%; right: 15%; animation-delay: 1s;"></div>
        <div class="circle" style="width: 30px; height: 30px; top: 60%; left: 10%; animation-delay: 2s;"></div>
    </div>

    <div class="container">
        <div class="glass-card">
            <div class="logo-container">
                <div class="logo-icon">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#0a192f" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z">
                        </path>
                        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                        <line x1="12" y1="22.08" x2="12" y2="12"></line>
                    </svg>
                </div>
                <span class="academy-name">CloudSpace Academy</span>
                <h1>Containerized Success</h1>
            </div>

            <div class="status-badge">
                <div class="status-dot"></div>
                RUNNING IN DOCKER
            </div>

            <p>Experience the simplicity of containerization. This demo highlights CloudSpace Academy's approach to
                teaching modern infrastructure. High-performance, low-overhead, total control.</p>
        </div>
    </div>
</body>

</html>
